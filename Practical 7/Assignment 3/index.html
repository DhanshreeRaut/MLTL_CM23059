<!DOCTYPE html>
<html>
<head>
    <title>AI Model Deployment</title>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

    <style>
        body {
            margin: 0;
            font-family: Consolas, monospace;
            background: black;
            color: #00ffcc;
            text-align: center;
            overflow: hidden;
        }

        /* 💻 AI Coding Background Effect */
        body::before {
            content: "0101010101010101010101010101010101 0101010101010101010101010101010101";
            position: fixed;
            width: 100%;
            height: 100%;
            color: rgba(0,255,200,0.05);
            font-size: 18px;
            white-space: pre-wrap;
            pointer-events: none;
        }

        .container {
            margin: 80px auto;
            width: 320px;
            background: rgba(0,0,0,0.85);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 25px #00ffcc;
            position: relative;
            z-index: 2;
        }

        h2 {
            color: #00ffcc;
        }

        input, button {
            width: 85%;
            padding: 10px;
            margin: 10px;
            border-radius: 6px;
            border: none;
            font-family: Consolas;
        }

        input {
            background: #111;
            color: #00ffcc;
            border: 1px solid #00ffcc;
        }

        button {
            background: #00ffcc;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #00ccaa;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>🤖 AI Model in Browser</h2>

    <button onclick="trainModel()">Train Model</button>
    <button onclick="exportModel()">Download Model</button>

    <br>

    <input type="file" id="jsonFile">
    <input type="file" id="weightsFile">

    <button onclick="importModel()">Load Model</button>

    <input type="number" id="inputValue" placeholder="Enter value">
    <button onclick="predict()">Predict</button>

    <h3 id="result">Result: </h3>
</div>

<script>
let model;

// 1️⃣ Train Model
async function trainModel() {

    model = tf.sequential();
    model.add(tf.layers.dense({ units: 1, inputShape: [1] }));

    model.compile({
        loss: 'meanSquaredError',
        optimizer: 'sgd'
    });

    const xs = tf.tensor2d([1, 2, 3, 4], [4, 1]);
    const ys = tf.tensor2d([3, 5, 7, 9], [4, 1]);

    document.getElementById("result").innerText = "Training...";
    await model.fit(xs, ys, { epochs: 200 });

    document.getElementById("result").innerText = "Training Done!";
}

// 2️⃣ Export Model (Download Files)
async function exportModel() {
    if (!model) {
        alert("Train model first!");
        return;
    }

    await model.save('downloads://my-model');
    document.getElementById("result").innerText = "Model downloaded!";
}

// 3️⃣ Import Model (Upload Files)
async function importModel() {

    const jsonFile = document.getElementById("jsonFile").files[0];
    const weightsFile = document.getElementById("weightsFile").files[0];

    if (!jsonFile || !weightsFile) {
        alert("Please upload both files!");
        return;
    }

    model = await tf.loadLayersModel(
        tf.io.browserFiles([jsonFile, weightsFile])
    );

    document.getElementById("result").innerText = "Model loaded!";
}

// 4️⃣ Predict
async function predict() {

    if (!model) {
        alert("Train or load model first!");
        return;
    }

    let input = document.getElementById("inputValue").value;

    let tensor = tf.tensor2d([[parseFloat(input)]]);
    let prediction = model.predict(tensor);
    let output = await prediction.data();

    document.getElementById("result").innerText =
        "Result: " + output[0].toFixed(2);
}
</script>

</body>
</html>
