<!DOCTYPE html>
<html>
<head>
<title>Text Sentiment Analysis</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

<style>

body{
font-family: Arial;
text-align:center;
background: linear-gradient(120deg,#89f7fe,#66a6ff);
padding:40px;
}

.container{
background:white;
padding:30px;
border-radius:10px;
width:450px;
margin:auto;
box-shadow:0px 0px 10px gray;
}

textarea{
width:100%;
height:100px;
padding:10px;
font-size:16px;
border-radius:5px;
border:1px solid gray;
}

button{
margin-top:15px;
padding:10px 20px;
font-size:16px;
background:#4CAF50;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#3e8e41;
}

.output{

margin-top:20px;
padding:20px;
border-radius:10px;

background-image:url("https://images.unsplash.com/photo-1490750967868-88aa4486c946");
background-size:cover;
background-position:center;

color:white;
font-size:18px;
font-weight:bold;

}

</style>
</head>

<body>

<div class="container">

<h2>Text Sentiment Analysis (RNN)</h2>

<p>Enter a sentence to classify sentiment</p>

<textarea id="textInput" placeholder="Type your sentence here..."></textarea>

<br>

<button onclick="analyze()">Analyze Sentiment</button>

<div class="output" id="resultBox">
Result will appear here 🌸
</div>

</div>

<script>

const positiveWords = [
"good","great","love","amazing","excellent",
"awesome","happy","wonderful","fantastic"
];

const negativeWords = [
"bad","terrible","hate","worst",
"awful","sad","boring","disappointing"
];

function analyze(){

let text = document.getElementById("textInput").value.toLowerCase();

if(text.trim()==""){
alert("Please enter text");
return;
}

let words = text.split(" ");

let pos = 0;
let neg = 0;

words.forEach(word => {

if(positiveWords.includes(word))
pos++;

if(negativeWords.includes(word))
neg++;

});

let sentiment="";
let confidence=0;

let total = pos + neg;

if(pos > neg){

sentiment="Positive 😊";
confidence=(pos/(total||1)*100).toFixed(2);

document.getElementById("resultBox").style.backgroundColor="rgba(0,200,83,0.7)";

}

else{

sentiment="Negative 😠";
confidence=(neg/(total||1)*100).toFixed(2);

document.getElementById("resultBox").style.backgroundColor="rgba(255,0,0,0.7)";

}

document.getElementById("resultBox").innerHTML=

"Prediction: " + sentiment +

"<br><br>Confidence Score: " + confidence + "%";

}

</script>

</body>
</html>
