<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sentiment Classifier</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#4facfe,#00f2fe);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    padding:30px;
    border-radius:10px;
    width:400px;
    text-align:center;
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

h2{
    margin-bottom:20px;
}

textarea{
    width:100%;
    height:100px;
    padding:10px;
    border-radius:5px;
    border:1px solid #ccc;
    font-size:16px;
}

button{
    margin-top:15px;
    padding:10px 20px;
    border:none;
    background:#4facfe;
    color:white;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#00c6ff;
}

.result{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}
</style>

</head>

<body>

<div class="container">
<h2>Sentiment Analysis</h2>

<textarea id="textInput" placeholder="Enter a sentence..."></textarea>

<br>
<button onclick="analyzeSentiment()">Analyze Sentiment</button>

<div class="result" id="result"></div>
</div>

<script>

// small dataset (training words)

const positiveWords = [
"good","great","awesome","happy","love","excellent","nice","wonderful","best","amazing"
];

const negativeWords = [
"bad","sad","terrible","worst","hate","angry","awful","poor","disappointing","boring"
];

function analyzeSentiment(){

let text = document.getElementById("textInput").value.toLowerCase();

let words = text.split(" ");

let score = 0;

words.forEach(word => {

if(positiveWords.includes(word)){
score++;
}

if(negativeWords.includes(word)){
score--;
}

});

let result = document.getElementById("result");

if(score > 0){
result.innerHTML = "😊 Positive Sentiment";
result.style.color = "green";
}
else if(score < 0){
result.innerHTML = "😡 Negative Sentiment";
result.style.color = "red";
}
else{
result.innerHTML = "😐 Neutral Sentiment";
result.style.color = "orange";
}

}

</script>

</body>
</html>
