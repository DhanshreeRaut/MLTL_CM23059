<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pose Detection - PoseNet</title>

  <style>
    body {
      margin: 0;
      text-align: center;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin-top: 15px;
    }

    canvas {
      border: 2px solid white;
      margin-top: 10px;
    }

    video {
      display: none;
    }
  </style>
</head>
<body>

  <h1>Human Pose Detection (PoseNet)</h1>

  <video id="video" width="640" height="480" autoplay playsinline></video>
  <canvas id="canvas" width="640" height="480"></canvas>

  <!-- TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>

  <!-- PoseNet -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet"></script>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let net;

    // 🎥 Setup Webcam
    async function setupCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: 640, height: 480 },
        audio: false
      });

      video.srcObject = stream;

      return new Promise((resolve) => {
        video.onloadedmetadata = () => {
          video.play();
          resolve(video);
        };
      });
    }

    // 🔴 Draw Keypoints
    function drawKeypoints(keypoints) {
      keypoints.forEach((point) => {
        if (point.score > 0.5) {
          const { x, y } = point.position;

          ctx.beginPath();
          ctx.arc(x, y, 6, 0, 2 * Math.PI);
          ctx.fillStyle = "red";
          ctx.fill();
        }
      });
    }

    // 🟢 Draw Skeleton
    function drawSkeleton(keypoints) {
      const adjacent = posenet.getAdjacentKeyPoints(keypoints, 0.5);

      adjacent.forEach((pair) => {
        ctx.beginPath();
        ctx.moveTo(pair[0].position.x, pair[0].position.y);
        ctx.lineTo(pair[1].position.x, pair[1].position.y);
        ctx.strokeStyle = "lime";
        ctx.lineWidth = 2;
        ctx.stroke();
      });
    }

    // 🔍 Detect Pose
    async function detectPose() {
      const pose = await net.estimateSinglePose(video, {
        flipHorizontal: true
      });

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      drawKeypoints(pose.keypoints);
      drawSkeleton(pose.keypoints);

      requestAnimationFrame(detectPose);
    }

    // 🚀 Main Function
    async function main() {
      try {
        await setupCamera();

        net = await posenet.load({
          architecture: "MobileNetV1",
          outputStride: 16,
          inputResolution: { width: 640, height: 480 },
          multiplier: 0.75
        });

        detectPose();

      } catch (error) {
        console.error(error);
        alert("Error accessing camera");
      }
    }

    main();
  </script>

</body>
</html>
