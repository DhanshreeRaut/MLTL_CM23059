<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Single vs Multi Pose Comparison</title>

<style>
  body {
    margin: 0;
    background: #0f172a;
    color: white;
    text-align: center;
    font-family: Arial;
  }

  h1 {
    margin: 10px;
  }

  .container {
    display: flex;
    justify-content: center;
    gap: 20px;
  }

  canvas {
    border: 2px solid white;
  }

  .info {
    margin-top: 5px;
    font-size: 16px;
  }

  video {
    display: none;
  }
</style>
</head>
<body>

<h1>Single Pose vs Multi Pose Analysis</h1>

<div class="container">
  <div>
    <h3>Single Pose</h3>
    <canvas id="canvas1" width="400" height="300"></canvas>
    <div class="info" id="info1"></div>
  </div>

  <div>
    <h3>Multi Pose</h3>
    <canvas id="canvas2" width="400" height="300"></canvas>
    <div class="info" id="info2"></div>
  </div>
</div>

<video id="video" width="640" height="480" autoplay playsinline></video>

<!-- TensorFlow -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>

<!-- PoseNet -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet"></script>

<script>
const video = document.getElementById("video");

const canvas1 = document.getElementById("canvas1");
const ctx1 = canvas1.getContext("2d");

const canvas2 = document.getElementById("canvas2");
const ctx2 = canvas2.getContext("2d");

const info1 = document.getElementById("info1");
const info2 = document.getElementById("info2");

let net;

// 🎥 Camera setup
async function setupCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: true,
    audio: false
  });

  video.srcObject = stream;

  return new Promise(resolve => {
    video.onloadedmetadata = () => {
      video.play();
      resolve(video);
    };
  });
}

// 🔴 Draw keypoints
function drawKeypoints(ctx, keypoints) {
  keypoints.forEach(point => {
    if (point.score > 0.5) {
      ctx.beginPath();
      ctx.arc(point.position.x / 1.6, point.position.y / 1.6, 4, 0, 2 * Math.PI);
      ctx.fillStyle = "red";
      ctx.fill();
    }
  });
}

// 🟢 Draw skeleton
function drawSkeleton(ctx, keypoints) {
  const adjacent = posenet.getAdjacentKeyPoints(keypoints, 0.5);

  adjacent.forEach(pair => {
    ctx.beginPath();
    ctx.moveTo(pair[0].position.x / 1.6, pair[0].position.y / 1.6);
    ctx.lineTo(pair[1].position.x / 1.6, pair[1].position.y / 1.6);
    ctx.strokeStyle = "lime";
    ctx.stroke();
  });
}

// 🔍 Detection loop
async function detect() {
  const start = performance.now();

  // SINGLE POSE
  const pose = await net.estimateSinglePose(video, {
    flipHorizontal: true
  });

  ctx1.drawImage(video, 0, 0, 400, 300);
  drawKeypoints(ctx1, pose.keypoints);
  drawSkeleton(ctx1, pose.keypoints);

  let visiblePoints = pose.keypoints.filter(p => p.score > 0.5).length;

  const singleTime = performance.now() - start;

  info1.innerText = 
    "Keypoints: " + visiblePoints +
    " | FPS: " + (1000 / singleTime).toFixed(1);

  // MULTI POSE
  const start2 = performance.now();

  const poses = await net.estimateMultiplePoses(video, {
    flipHorizontal: true,
    maxDetections: 5,
    scoreThreshold: 0.5
  });

  ctx2.drawImage(video, 0, 0, 400, 300);

  let totalPeople = poses.length;
  let totalKeypoints = 0;

  poses.forEach(p => {
    drawKeypoints(ctx2, p.keypoints);
    drawSkeleton(ctx2, p.keypoints);
    totalKeypoints += p.keypoints.filter(k => k.score > 0.5).length;
  });

  const multiTime = performance.now() - start2;

  info2.innerText = 
    "People: " + totalPeople +
    " | Keypoints: " + totalKeypoints +
    " | FPS: " + (1000 / multiTime).toFixed(1);

  requestAnimationFrame(detect);
}

// 🚀 Main
async function main() {
  await setupCamera();

  net = await posenet.load({
    architecture: "MobileNetV1",
    outputStride: 16,
    inputResolution: { width: 640, height: 480 },
    multiplier: 0.75
  });

  detect();
}

main();
</script>

</body>
</html>
