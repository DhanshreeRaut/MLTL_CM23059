<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Squat Counter (PoseNet)</title>

  <style>
    body {
      margin: 0;
      text-align: center;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin-top: 10px;
    }

    canvas {
      border: 2px solid white;
      margin-top: 10px;
    }

    #counter {
      font-size: 28px;
      margin-top: 10px;
      color: #22c55e;
    }

    video {
      display: none;
    }
  </style>
</head>
<body>

  <h1>Squat Counter using PoseNet</h1>
  <div id="counter">Reps: 0</div>

  <video id="video" width="640" height="480" autoplay playsinline></video>
  <canvas id="canvas" width="640" height="480"></canvas>

  <!-- TensorFlow -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>

  <!-- PoseNet -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet"></script>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const counterText = document.getElementById("counter");

    let net;
    let squatCount = 0;
    let stage = "up"; // up or down

    // 🎥 Camera setup
    async function setupCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: 640, height: 480 },
        audio: false
      });

      video.srcObject = stream;

      return new Promise((resolve) => {
        video.onloadedmetadata = () => {
          video.play();
          resolve(video);
        };
      });
    }

    // 📐 Calculate angle
    function calculateAngle(A, B, C) {
      const AB = { x: A.x - B.x, y: A.y - B.y };
      const CB = { x: C.x - B.x, y: C.y - B.y };

      const dot = (AB.x * CB.x + AB.y * CB.y);
      const magAB = Math.sqrt(AB.x ** 2 + AB.y ** 2);
      const magCB = Math.sqrt(CB.x ** 2 + CB.y ** 2);

      const angle = Math.acos(dot / (magAB * magCB));
      return (angle * 180) / Math.PI;
    }

    // 🔴 Draw keypoints
    function drawKeypoints(keypoints) {
      keypoints.forEach(point => {
        if (point.score > 0.5) {
          ctx.beginPath();
          ctx.arc(point.position.x, point.position.y, 5, 0, 2 * Math.PI);
          ctx.fillStyle = "red";
          ctx.fill();
        }
      });
    }

    // 🟢 Draw skeleton
    function drawSkeleton(keypoints) {
      const adjacent = posenet.getAdjacentKeyPoints(keypoints, 0.5);

      adjacent.forEach(pair => {
        ctx.beginPath();
        ctx.moveTo(pair[0].position.x, pair[0].position.y);
        ctx.lineTo(pair[1].position.x, pair[1].position.y);
        ctx.strokeStyle = "lime";
        ctx.lineWidth = 2;
        ctx.stroke();
      });
    }

    // 🏋️ Detect pose + count squats
    async function detectPose() {
      const pose = await net.estimateSinglePose(video, {
        flipHorizontal: true
      });

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      drawKeypoints(pose.keypoints);
      drawSkeleton(pose.keypoints);

      // Get keypoints
      const hip = pose.keypoints[11];   // leftHip
      const knee = pose.keypoints[13];  // leftKnee
      const ankle = pose.keypoints[15]; // leftAnkle

      if (hip.score > 0.5 && knee.score > 0.5 && ankle.score > 0.5) {

        const angle = calculateAngle(
          hip.position,
          knee.position,
          ankle.position
        );

        // Show angle
        ctx.fillStyle = "yellow";
        ctx.font = "20px Arial";
        ctx.fillText("Angle: " + angle.toFixed(1), knee.position.x, knee.position.y - 10);

        // Squat logic
        if (angle < 90) {
          stage = "down";
        }

        if (angle > 160 && stage === "down") {
          stage = "up";
          squatCount++;
          counterText.innerText = "Reps: " + squatCount;
        }
      }

      requestAnimationFrame(detectPose);
    }

    // 🚀 Main
    async function main() {
      try {
        await setupCamera();

        net = await posenet.load({
          architecture: "MobileNetV1",
          outputStride: 16,
          inputResolution: { width: 640, height: 480 },
          multiplier: 0.75
        });

        detectPose();

      } catch (err) {
        alert("Camera error!");
        console.error(err);
      }
    }

    main();
  </script>

</body>
</html>
